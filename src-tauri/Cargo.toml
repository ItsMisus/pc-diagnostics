[package]
name = "pc-diagnostics"
description = "PC Diagnostics desktop app shell: IPC commands, state, validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "pc_diagnostics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
models.workspace = true
platform.workspace = true
monitor.workspace = true
processes.workspace = true
drivers.workspace = true
bench.workspace = true
diagnostics.workspace = true
persistence.workspace = true
control.workspace = true
assistant.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = [] }
# Gaming: native picker for "Aggiungi gioco" (frontend opens it, the backend validates the path).
tauri-plugin-dialog = "2"
# Gaming: system notification when game mode switches on or off by itself (Rust side only,
# nothing exposed to the frontend).
tauri-plugin-notification = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[lints]
workspace = true
