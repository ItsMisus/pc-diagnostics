name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows (Win32 APIs, WebView2).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Rust and web checks (fmt, clippy, tests, typecheck, vitest, build)
        run: npm run check

      - name: Generated TypeScript types are committed
        shell: bash
        run: git diff --exit-code -- src/types/generated

  check-macos:
    # Same checks on macOS (macos-latest is an Apple Silicon runner). The macOS providers
    # live in crates/platform/src/macos; anything macOS does not expose is reported as
    # unavailable, so the same test suite runs on both systems.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Rust and web checks (fmt, clippy, tests, typecheck, vitest, build)
        run: npm run check

      - name: Generated TypeScript types are committed
        run: git diff --exit-code -- src/types/generated
